name: secret-scan

# This repository is assembled by copying scrubbed files out of a private
# monorepo. Human care got them clean once; this keeps them clean.
#
# NOTE ON ORDERING: this workflow runs AFTER a push, so on a public repo a
# failure here means the content is already public. It is a backstop, not the
# primary defence. The primary defence is scripts/preflight.sh run by the
# local pre-push hook, which is the same script this job invokes.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: publish gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the same gate the pre-push hook runs
        run: ./scripts/preflight.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

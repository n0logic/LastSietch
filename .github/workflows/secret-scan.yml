name: public-source-checks

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publication and regression checks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          export GITLEAKS_BIN="$scanner_dir/gitleaks"
          bash scripts/preflight.sh --staged
          python3 scripts/tests/test_public_preflight.py
          python3 scripts/tests/test_server_schedule.py
          "$GITLEAKS_BIN" dir --redact=100 --no-banner --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$scanner_dir/no-ignore" --config .gitleaks.toml .
          # Current-tree checks are a backstop. The publisher also scans outgoing
          # commits, author metadata and a private inventory BEFORE any public push.

<!doctype html>
<html lang="en" data-theme="night" data-house="none">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070603" />

    <!-- Link unfurl (Discord, Slack, X). Static on purpose: the SPA fallback is
         adapter-static and no unfurler runs JS, so a svelte:head tag would never
         be seen. Absolute URLs for the same reason. Bump the ?v= key whenever
         og-fremkit.jpg is replaced, or the caches keep the old art. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Last Sietch" />
    <meta property="og:title" content="The Last Sietch Portal" />
    <meta property="og:description" content="Deep Desert maps, the community blueprint market, guild rosters and reward tracking for the Last Sietch Dune: Awakening servers." />
    <meta property="og:url" content="https://portal.lastsietch.com/" />
    <meta property="og:image" content="https://portal.lastsietch.com/og-fremkit.jpg?v=20260902" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Last Sietch Portal" />
    <meta name="twitter:description" content="Deep Desert maps, the community blueprint market, guild rosters and reward tracking for the Last Sietch Dune: Awakening servers." />
    <meta name="twitter:image" content="https://portal.lastsietch.com/og-fremkit.jpg?v=20260902" />
    <script>
      // No-FOUC theme boot: apply the saved mode + house before first paint.
      (function () {
        try {
          var t = localStorage.getItem('ls-theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
          var h = localStorage.getItem('ls-house');
          if (h) document.documentElement.setAttribute('data-house', h);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <script src="%sveltekit.assets%/register-sw.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

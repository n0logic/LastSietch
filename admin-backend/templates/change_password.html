{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container">
  <div class="card" style="max-width: 450px;">
    <div class="card-title">Change Password</div>
    <div class="msg" id="pw-msg"></div>
    <form id="pw-form" onsubmit="return changePassword(event)">
      <div class="form-group">
        <label for="current-password">Current Password</label>
        <input type="password" id="current-password" autocomplete="current-password" required>
      </div>
      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" autocomplete="new-password" required>
        <div class="form-hint">Minimum 16 characters</div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-accent" id="btn-submit">Change Password</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('nav-password').classList.add('active');

function changePassword(e) {
  e.preventDefault();
  hideMsg('pw-msg');

  var current = document.getElementById('current-password').value;
  var newPw = document.getElementById('new-password').value;
  var confirm = document.getElementById('confirm-password').value;

  if (newPw !== confirm) {
    showMsg('pw-msg', 'Passwords do not match.', 'error');
    return false;
  }
  if (newPw.length < 16) {
    showMsg('pw-msg', 'Password must be at least 16 characters.', 'error');
    return false;
  }

  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Changing...';

  apiCall('POST', '/admin/api/auth/change-password', {
    current_password: current,
    new_password: newPw
  }).then(function() {
    showMsg('pw-msg', 'Password changed successfully.', 'success');
    document.getElementById('pw-form').reset();
    btn.disabled = false;
    btn.textContent = 'Change Password';
  }).catch(function(err) {
    showMsg('pw-msg', err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Change Password';
  });

  return false;
}
</script>
{% endblock %}

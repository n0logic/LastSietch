<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Last Sietch Admin</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --bg-card: #111118;
  --accent: #d4891c;
  --accent-glow: rgba(212, 137, 28, 0.3);
  --green: #00ff41;
  --red: #c0392b;
  --text: #e0e0e0;
  --text-muted: #888899;
  --border: #2a2a35;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Inter', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  background-image:
    linear-gradient(0deg, rgba(10,10,15,0.82) 0%, rgba(10,10,15,0.60) 46%, rgba(10,10,15,0.78) 100%),
    url("/admin/static/img/admin-hero.jpg?v=20260611a");
  background-size: cover;
  background-position: center 40%;
  color: var(--text);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  background: rgba(17, 17, 24, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(42, 42, 53, 0.9);
  border-top: 2px solid rgba(212, 137, 28, 0.55);
  border-radius: 8px;
  padding: 2.5rem;
  width: 100%;
  max-width: 380px;
  margin: 1rem;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(212,137,28,0.08);
}

.login-title {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent);
  font-size: 1.3rem;
  text-align: center;
  margin-bottom: 0.5rem;
}

.login-subtitle {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 2rem;
}

.form-group { margin-bottom: 1.25rem; }

label {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 0.3rem;
}

input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.7rem 1rem;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  width: 100%;
}

input:focus { border-color: var(--accent); outline: none; }

.btn-login {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  padding: 0.7rem;
  width: 100%;
  border: 1px solid var(--accent);
  border-radius: 4px;
  cursor: pointer;
  background: transparent;
  color: var(--accent);
  transition: all 0.2s;
  margin-top: 0.5rem;
}

.btn-login:hover { background: var(--accent-glow); }
.btn-login:disabled { opacity: 0.4; cursor: not-allowed; }

.error-msg {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--red);
  background: rgba(192, 57, 43, 0.1);
  border: 1px solid var(--red);
  border-radius: 4px;
  padding: 0.6rem 0.8rem;
  margin-bottom: 1rem;
  display: none;
}

.success-msg {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--green);
  background: rgba(0, 255, 65, 0.1);
  border: 1px solid var(--green);
  border-radius: 4px;
  padding: 0.6rem 0.8rem;
  margin-bottom: 1rem;
  display: none;
}

.login-note {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-align: center;
  margin-top: 1.5rem;
}
</style>
</head>
<body>

<div class="login-box">
  <div class="login-title">Last Sietch</div>
  <div class="login-subtitle">Admin Panel</div>

  <div class="success-msg" id="success-msg"></div>
  <div class="error-msg" id="error-msg"></div>

  <form id="login-form" onsubmit="return doLogin(event)">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="btn-submit">Login</button>
  </form>

  <div class="login-note">Forgot password? Contact an admin.</div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('setup') === 'ok') {
    var el = document.getElementById('success-msg');
    el.textContent = 'Admin account created. Please log in.';
    el.style.display = 'block';
  }
})();

function doLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('btn-submit');
  var errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;

  fetch('/admin/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify({ username: username, password: password })
  }).then(function(r) {
    return r.json().then(function(data) { return { ok: r.ok, status: r.status, data: data }; });
  }).then(function(res) {
    if (res.ok) {
      window.location = '/admin/';
    } else {
      var msg = res.data.detail || 'Login failed';
      if (res.status === 429) {
        msg = 'Too many attempts. Try again in 60 seconds.';
      } else if (res.status === 423) {
        msg = 'Account locked. Try again later.';
      }
      errEl.textContent = msg;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  }).catch(function() {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Login';
  });

  return false;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initial Setup — Last Sietch Admin</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --bg-card: #111118;
  --accent: #d4891c;
  --accent-glow: rgba(212, 137, 28, 0.3);
  --red: #c0392b;
  --text: #e0e0e0;
  --text-muted: #888899;
  --border: #2a2a35;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Inter', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.setup-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2.5rem;
  width: 100%;
  max-width: 380px;
  margin: 1rem;
}

.setup-title {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent);
  font-size: 1.3rem;
  text-align: center;
  margin-bottom: 0.5rem;
}

.setup-subtitle {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 2rem;
}

.form-group { margin-bottom: 1.25rem; }

label {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 0.3rem;
}

input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.7rem 1rem;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  width: 100%;
}

input:focus { border-color: var(--accent); outline: none; }
input[readonly] { opacity: 0.6; cursor: not-allowed; }

.form-hint {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
}

.btn-setup {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  padding: 0.7rem;
  width: 100%;
  border: 1px solid var(--accent);
  border-radius: 4px;
  cursor: pointer;
  background: transparent;
  color: var(--accent);
  transition: all 0.2s;
  margin-top: 0.5rem;
}

.btn-setup:hover { background: var(--accent-glow); }
.btn-setup:disabled { opacity: 0.4; cursor: not-allowed; }

.error-msg {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--red);
  background: rgba(192, 57, 43, 0.1);
  border: 1px solid var(--red);
  border-radius: 4px;
  padding: 0.6rem 0.8rem;
  margin-bottom: 1rem;
  display: none;
}
</style>
</head>
<body>

<div class="setup-box">
  <div class="setup-title">Initial Setup</div>
  <div class="setup-subtitle">Create the admin account</div>

  <div class="error-msg" id="error-msg"></div>

  <form id="setup-form" onsubmit="return doSetup(event)">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="admin" readonly>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required autofocus>
      <div class="form-hint">Minimum 16 characters</div>
    </div>
    <div class="form-group">
      <label for="password2">Confirm Password</label>
      <input type="password" id="password2" name="password2" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn-setup" id="btn-submit">Create Admin Account</button>
  </form>
</div>

<script>
function doSetup(e) {
  e.preventDefault();
  var btn = document.getElementById('btn-submit');
  var errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';

  var password = document.getElementById('password').value;
  var password2 = document.getElementById('password2').value;

  if (password !== password2) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block';
    return false;
  }

  if (password.length < 16) {
    errEl.textContent = 'Password must be at least 16 characters.';
    errEl.style.display = 'block';
    return false;
  }

  btn.disabled = true;
  btn.textContent = 'Creating...';

  fetch('/admin/api/setup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify({ username: 'admin', password: password })
  }).then(function(r) {
    return r.json().then(function(data) { return { ok: r.ok, data: data }; });
  }).then(function(res) {
    if (res.ok) {
      window.location = '/admin/login?setup=ok';
    } else {
      errEl.textContent = res.data.detail || 'Setup failed';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Admin Account';
    }
  }).catch(function() {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Admin Account';
  });

  return false;
}
</script>

</body>
</html>

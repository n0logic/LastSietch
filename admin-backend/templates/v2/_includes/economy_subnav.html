  <a class="v2-subnav__tab{% if nav_path.startswith('/v2/economy') %} v2-subnav__tab--active{% endif %}" href="/admin/v2/economy">History</a>
  <a class="v2-subnav__tab{% if nav_path.startswith('/v2/portal/karum') %} v2-subnav__tab--active{% endif %}" href="/admin/v2/portal/karum">Karum</a>
</nav>

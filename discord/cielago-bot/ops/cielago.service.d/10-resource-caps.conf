# Resource caps for the Cielago service on the web host (mail.example.com).
#
# The Assistant runs IN-PROCESS inside the existing Cielago bot, so the caps
# apply to the whole cielago.service. the web host is a busy SHARED prod host
# (AMD EPYC 7763, 3 cores, 23.4 GB RAM) also running Stalwart mail + 3 uvicorn
# apps + a Docker fleet. Mail/apps must always win contention (plan §6).
#
# Install as a systemd drop-in (does NOT replace the unit):
#   sudo install -D -m644 10-resource-caps.conf \
#       /etc/systemd/system/cielago.service.d/10-resource-caps.conf
#   sudo systemctl daemon-reload && sudo systemctl restart cielago
#   systemctl show cielago -p CPUQuotaPerSecUSec -p MemoryMax -p Nice
#
# Safe to restart cielago anytime — it is NOT a game pod (see the hard safety
# rules; only Dune game pods/battlegroups are restart-fragile).

[Service]
# ~1.2 of 3 cores. Embedding + dedup is the only burst; bge-small on CPU is brief.
CPUQuota=40%
CPUWeight=20
# 1 GiB hard ceiling; soft pressure reclaim kicks in at 768 MiB. bge-small ONNX
# resident set is ~300-400 MB; the hashing fallback is negligible.
MemoryMax=1G
MemoryHigh=768M
# Yield CPU + disk to mail/apps.
Nice=10
IOWeight=50

; Settings in these config files will be applied to every server in the battlegroup
; If you need to override different settings for different servers, use the battlegroup editor instead

[URL]
; The starting port that servers listen to for players. Each server
; will use the next available port in a sequence (7777, 7778 etc.). The range should
; not intersect with the IGWPort range bellow
Port=7777
; The port that servers listen to for other servers. Each server
; will use the next available port in a sequence (7888, 7889 etc.). The range should
; not intersect with the Port range above
IGWPort=7888

[ConsoleVariables]
; Last Sietch 2026-08-18: difficulty-cvars. Four of five are at STOCK; the only lever
; we hold is Dune.GiveDoubleDifficultyLoot. Ground truth is the array in
; ops/difficulty-cvars/apply-difficulty-cvars.sh -- this file is a reference copy
; and is NOT deployed by anything. It carried 0.3 here until 2026-08-24 while live
; had -1 since 08-18; corrected against a live --dry-run read.
Weapon.AiOverrideHitChance=-1
NPC.EnableNpcAttackLimits=0
NPC.AttackLimitOverride=0
Ai.InvestigationRadius=1000
Dune.GiveDoubleDifficultyLoot=true
; Last Sietch 2026-07-30: BRT cooldown override.
;   m_BaseBackupToolTimeRestrictionInSeconds is INERT; this CVAR is the real lever.
;   Client-gated: players must add the same cvar to their own Engine.ini.
dw.OverrideBaseBackupToolTimeRestrictionInSeconds=10
; Set the name of every Sietch in the battlegroup
; If Sietches should have different names use the battlegroup editor instead
; Special characters like ' and | are not allowed and double quotes should be used
Bgd.ServerDisplayName="Sietch Tabr-complete"

; Set a password for every Sietch in the battlegroup
; If Sietches should have different passwords use the battlegroup editor instead
; Special characters like ' and | are not allowed and double quotes should be used
;Bgd.ServerLoginPassword="Sandworm"

; Mining multipliers
; Last Sietch 2026-05-20: raised hand + vehicle mining 1.0 -> 1.5 (player-experience tuning)
Dune.GlobalMiningOutputMultiplier=3.0
Dune.GlobalVehicleMiningOutputMultiplier=3.0
SecurityZones.PvpResourceMultiplier=3.5

; Durability damage multiplier for vehicles | (0 to 10)  0=off
; Last Sietch 2026-05-20: lowered 1.0 -> 0.5 so vehicles last longer
dw.VehicleDurabilityDamageMultiplier=0.5

; Sandstorm and sandstorm treasure spawning settings
Sandstorm.Enabled=1
Sandstorm.Treasure.Enabled=1 

; Sandworm settings
sandworm.dune.Enabled=1
; Sandworm can push/damage vehicles
Vehicle.SandwormCollisionInteraction=false
; Enables dangerzones where the sandworm can attack
Sandworm.SandwormDangerZonesEnabled=true
; Seconds of invunerability from sandworm on specific situations
Vehicle.SandwormInvulnerabilitySecondsOnExit=900.0
Vehicle.SandwormInvulnerabilitySecondsOnServerRestart=7200.0
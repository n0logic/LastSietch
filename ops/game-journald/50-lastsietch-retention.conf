# 2026-10-20 (owner: every host must keep enough logs to investigate security issues).
# lastsietch-rmq-capture-admin writes ~128k lines/h, which rotated the default 3.9G cap in ~2 days
# and took the ssh/auth history with it. 2.6T free: keep up to 60G or 90 days.
[Journal]
Storage=persistent
SystemMaxUse=60G
SystemKeepFree=200G
MaxRetentionSec=90day

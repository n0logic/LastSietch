# Anchor the first firing to the TIMER's own activation.
#
# These timers previously relied on OnBootSec for their initial anchor and
# OnUnitActiveSec for cadence. OnUnitActiveSec is relative to the SERVICE's
# last activation, so a timer stopped and restarted without a reboot -- which
# is exactly what a maintenance hold does -- has no valid anchor and systemd
# schedules nothing at all. The unit reads "active" while being permanently
# dormant.
#
# Added 2026-09-19 after 12 of 23 timers restored from the 09-17 maintenance
# hold sat active with NextElapse=infinity for two days, silently stopping
# welcome-pack grants among other things.
[Timer]
OnActiveSec=60s
